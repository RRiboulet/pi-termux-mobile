plugins {
    id 'com.android.application'
}

// Run on every build: the script packages the mobile runtime and preserves unchanged assets.
def mobileRoot = rootProject.projectDir.parentFile
tasks.register('prepareMobileRuntime', Exec) {
    workingDir mobileRoot
    commandLine 'python3', new File(mobileRoot, 'scripts/prepare-runtime.py').absolutePath
}
tasks.named('preBuild').configure { dependsOn 'prepareMobileRuntime' }

android {
    namespace 'org.pimobile.app'
    compileSdk 35

    defaultConfig {
        // Exactly 10 characters, like com.termux: scripts/package-rootfs.ts rewrites the Termux prefix
        // /data/data/com.termux to /data/data/<applicationId> in place, so the two must have the same length
        // or the patched binaries keep the wrong paths. The script asserts it and fails the build.
        applicationId 'app.pidabl'
        minSdk 26
        // targetSdk 28 keeps direct exec() of app-private binaries working
        // (Android 10+ blocks exec in app home for targetSdk >= 29).
        // Sideload/F-Droid only; Play requires a higher targetSdk.
        targetSdk 28
        versionCode 5
        versionName '0.0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }


}
